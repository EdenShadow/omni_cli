<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>团队进展 · 万物画布</title><style>
:root{font:14px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;color:#213b31;background:#f0f3ed}*{box-sizing:border-box}body{margin:0;padding:clamp(22px,5vw,65px)}header{display:flex;justify-content:space-between;align-items:center;gap:15px}header p{font-size:11px;letter-spacing:.18em;color:#65816f}h1{font-size:clamp(28px,4vw,48px);font-weight:550;letter-spacing:-.05em;margin:13px 0}h1 span{color:#779082}button{border:1px solid #cbd7cd;background:#fff;color:#2d5841;padding:12px 18px;border-radius:30px;cursor:pointer;font:inherit}button:hover{background:#dfeadd}.lead{color:#708174;margin:0 0 35px;line-height:1.8}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}.metric{background:#fafcf8;border:1px solid #dbe4da;border-radius:19px;padding:24px;min-height:150px}.metric small{color:#738678}.metric strong{display:block;font-size:46px;font-weight:500;margin:16px 0 5px;letter-spacing:-.04em}.metric p{font-size:11px;color:#8a9a8d}.lower{display:grid;grid-template-columns:1.8fr 1fr;gap:20px;margin-top:22px}.chart,.memo{background:#fafcf8;border:1px solid #dbe4da;border-radius:19px;padding:25px}h2{font-size:15px;font-weight:600;margin:0 0 20px}.bars{display:flex;align-items:flex-end;gap:clamp(10px,2vw,24px);height:160px;padding:0 5px;border-bottom:1px solid #dce4da}.bars span{background:#668773;width:100%;border-radius:5px 5px 0 0;position:relative;min-width:15px}.bars span:nth-child(even){background:#bfd0b8}.bars i{position:absolute;top:-22px;font-style:normal;font-size:10px;width:100%;text-align:center;color:#69816e}textarea{background:transparent;border:0;resize:vertical;width:100%;height:130px;outline:none;font:14px/1.9 inherit;color:#566d5b}.memo button{font-size:12px;padding:9px 14px}.status{font-size:11px;color:#66816f;margin-top:18px;min-height:20px}.status.error{color:#b65540}footer{display:flex;justify-content:space-between;margin-top:22px;color:#7b8b7d;font-size:10px}.pointer{position:fixed;width:9px;height:9px;border-radius:50%;background:#d99d55;pointer-events:none;opacity:.7;display:none}@media(max-width:600px){.metrics{gap:8px}.metric{padding:15px 10px;min-height:120px}.metric strong{font-size:32px}.lower{grid-template-columns:1fr}header button{padding:10px;font-size:11px}.bars{height:130px}}
</style></head><body><header><div><p>TEAM SPACE / LIVE DASHBOARD</p><h1>一起，把想法<span>变成进展。</span></h1></div><button id="complete">完成一项任务 ＋</button></header><p class="lead">一个属于团队的共享视角。数据与备注实时同步，每一次小小的推进，都看得见。</p><section class="metrics"><article class="metric"><small>已完成任务</small><strong id="done">24</strong><p>团队共同累积</p></article><article class="metric"><small>本周进度</small><strong id="progress">68%</strong><p>离目标更近一步</p></article><article class="metric"><small>协作项目</small><strong>06</strong><p>示例指标 · 可接真实数据</p></article></section><section class="lower"><article class="chart"><h2>每一天，都有新的进展</h2><div class="bars"><span style="height:32%"><i>周一</i></span><span style="height:58%"><i>周二</i></span><span style="height:45%"><i>周三</i></span><span style="height:83%"><i>周四</i></span><span style="height:66%"><i>周五</i></span><span style="height:90%"><i>周六</i></span><span style="height:73%"><i>周日</i></span></div></article><article class="memo"><h2>写给团队</h2><textarea id="note" aria-label="团队备注" placeholder="今天有哪些新进展？"></textarea><button id="save">同步备注</button></article></section><div class="status" id="status">正在连接团队…</div><footer><span>WANWU CANVAS / OPEN POSSIBILITIES</span><span id="team">团队共享画布</span></footer><span class="pointer" id="pointer"></span><script>
let counter={key:'counter',value:{done:24},revision:0},note={key:'note',value:'一起打磨这一版，期待每个人的想法。',revision:0};
const el=id=>document.getElementById(id),status=(text,error=false)=>{el('status').textContent=text;el('status').className='status'+(error?' error':'');};
function render(doc){if(doc.key==='counter'){counter=doc;const n=doc.value?.done??24;el('done').textContent=n;el('progress').textContent=Math.min(100,Math.round(n/35*100))+'%';}if(doc.key==='note'){note=doc;if(document.activeElement!==el('note'))el('note').value=doc.value??'一起打磨这一版，期待每个人的想法。';}}
async function run(fn){try{await fn();status('已同步 · 团队成员可实时看到更新');}catch(e){status(e.status===409?'其他成员刚刚更新了内容，请检查最新数据再保存。':e.message,true);}}
Wanwu.ready.then(async context=>{el('team').textContent=context.project.name;render(await Wanwu.state.get('counter'));render(await Wanwu.state.get('note'));status('已连接 · 这是可共同编辑的示例数据');});
Wanwu.state.subscribe(render);Wanwu.live.provide(()=>({page:'team-dashboard',completed:Number(el('done').textContent),progress:el('progress').textContent,note:el('note').value,selection:document.activeElement?.id||null}));
el('complete').onclick=()=>run(async()=>{for(let i=0;i<3;i++){const latest=await Wanwu.state.get('counter');try{render(await Wanwu.state.set('counter',{done:(latest.value?.done??24)+1},latest.revision));return;}catch(e){if(e.status!==409||i===2)throw e;}}});
el('save').onclick=()=>run(async()=>{const text=el('note').value;try{render(await Wanwu.state.set('note',text,note.revision));}catch(e){if(e.status===409)note=await Wanwu.state.get('note');throw e;}});
let lastPointer=0;document.addEventListener('pointermove',e=>{if(Date.now()-lastPointer<60)return;lastPointer=Date.now();Wanwu.room.publish('cursor',{x:e.clientX/innerWidth,y:e.clientY/innerHeight},{key:'pointer'}).catch(()=>{});});
let pointerTimer;Wanwu.room.subscribe(m=>{if(m.topic!=='cursor'||!Number.isFinite(m.data?.x)||!Number.isFinite(m.data?.y))return;const p=el('pointer');p.style.left=m.data.x*innerWidth+'px';p.style.top=m.data.y*innerHeight+'px';p.style.display='block';clearTimeout(pointerTimer);pointerTimer=setTimeout(()=>p.style.display='none',800);});
</script></body></html>
