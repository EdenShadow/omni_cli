<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>这一周 · 团队备忘录</title><style>
:root{font:15px/1.6 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;color:#292a2d;background:#f8f6f2;--paper:#fffdfa;--soft:#efede8;--line:#dedbd5;--muted:#72706b;--ink:#292a2d;--accent:#383a40;--on:#fffdfa}*{box-sizing:border-box}body{margin:0;padding:clamp(22px,5vw,64px);max-width:1500px;margin:auto}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--paper);color:inherit;border-radius:12px;min-height:44px;padding:9px 15px}button:hover{background:var(--soft)}button:disabled{opacity:.5;cursor:wait}input,textarea{border:1px solid var(--line);background:var(--paper);color:inherit;border-radius:10px;padding:12px;width:100%}:focus-visible{outline:2px solid #8581aa;outline-offset:3px}header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding-bottom:32px;border-bottom:1px solid var(--line)}.brand{font-size:13px;color:var(--muted)}h1{font-size:clamp(32px,4vw,54px);line-height:1.3;letter-spacing:-.045em;margin:10px 0 8px;font-weight:650}header p{margin:0;color:var(--muted)}.week-nav{display:flex;gap:8px;flex-shrink:0}.layout{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(260px,1fr);gap:clamp(24px,4vw,60px);margin-top:36px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:16px}h2{font-size:20px;margin:0;font-weight:600}.count{font-size:13px;color:var(--muted)}.progress{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin:18px 0 25px}.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}.tabs{display:flex;gap:5px;margin-bottom:20px}.tabs button{border:0;background:transparent;color:var(--muted);padding:8px 13px}.tabs button[aria-pressed=true]{background:var(--soft);color:var(--ink)}ul{padding:0;margin:0;list-style:none}.task{display:flex;gap:13px;padding:18px 0;border-bottom:1px solid var(--line);align-items:flex-start}.check{width:24px;min-width:24px;height:24px;min-height:24px;border-radius:50%;padding:0;margin:4px 0;border-color:#97958f}.check[aria-pressed=true]{background:var(--accent);color:var(--on);border-color:var(--accent)}.task-body{flex:1;min-width:0}.task-title{display:block;overflow-wrap:anywhere}.task.done .task-title{text-decoration:line-through;color:var(--muted)}.task small{color:var(--muted);font-size:12px}.task .edit,.task .remove{border:0;padding:6px;min-width:38px;min-height:38px;background:transparent;color:var(--muted);font-size:13px}.empty{padding:45px 18px;text-align:center;background:var(--paper);border:1px dashed var(--line);border-radius:16px;color:var(--muted)}.empty strong{display:block;font-size:18px;font-weight:500;color:var(--ink);margin-bottom:6px}.add{margin-top:25px;padding:20px;background:var(--paper);border:1px solid var(--line);border-radius:17px}.add input[type=text]{padding:2px 0 13px;border:0;border-radius:0;background:transparent}.add-bottom{border-top:1px solid var(--line);padding-top:14px;display:flex;align-items:center;gap:10px;justify-content:space-between}.add input[type=date]{width:155px;font-size:12px;padding:6px;min-height:40px;border:0}.primary{background:var(--accent);color:var(--on);border-color:var(--accent)}.primary:hover{opacity:.85;background:var(--accent)}aside{background:var(--soft);border-radius:20px;padding:27px;align-self:start}aside p{font-size:13px;color:var(--muted);margin:8px 0 22px}textarea{min-height:230px;background:transparent;border:0;resize:vertical;padding:0;line-height:1.9}aside footer{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:18px}.status{margin-top:25px;min-height:24px;color:var(--muted);font-size:12px}.status.error{color:#b04e3e}dialog{padding:26px;width:min(440px,calc(100vw - 32px));border:1px solid var(--line);border-radius:20px;background:var(--paper);color:var(--ink)}dialog::backdrop{background:#11121688}dialog p{color:var(--muted)}dialog footer{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}dialog label{display:block;margin-top:15px}dialog input{margin-top:6px}.danger{background:#a94335;color:#fff;border-color:#a94335}@media(prefers-color-scheme:dark){:root{background:#1c1c1e;color:#f2f2f4;--paper:#242426;--soft:#2c2c2f;--line:#424248;--muted:#aeaeb4;--ink:#f2f2f4;--accent:#e5e5e7;--on:#242426}}@media(max-width:700px){body{padding:24px 18px}header{align-items:start;flex-direction:column;padding-bottom:24px}.week-nav{width:100%;justify-content:space-between}.layout{grid-template-columns:1fr;margin-top:24px;gap:30px}.task{gap:10px}.task .edit,.task .remove{min-width:34px}aside{padding:23px}.check{width:30px;min-width:30px;height:30px}textarea{min-height:180px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><header><div><span class="brand" id="project">团队共享备忘录</span><h1>这一周，慢慢做好。</h1><p id="range">正在读取周计划…</p></div><nav class="week-nav" aria-label="选择周"><button id="prev" aria-label="上一周">←</button><button id="today">回到本周</button><button id="next" aria-label="下一周">→</button></nav></header><div class="layout"><main><div class="section-head"><h2>本周待办</h2><span class="count" id="count">0 / 0 完成</span></div><div class="progress"><i id="progress"></i></div><div class="tabs" aria-label="任务筛选"><button data-filter="all" aria-pressed="true">全部</button><button data-filter="open" aria-pressed="false">待完成</button><button data-filter="done" aria-pressed="false">已完成</button></div><ul id="tasks"></ul><form class="add" id="add"><input id="title" type="text" aria-label="新任务" placeholder="记下这周想做的一件事…" maxlength="200" required><div class="add-bottom"><input id="due" type="date" aria-label="截止日期"><button class="primary" type="submit">添加待办 ＋</button></div></form></main><aside><h2>写给这一周</h2><p>想法、重点、提醒。团队一起记，也一起看。</p><textarea id="note" aria-label="本周备忘" placeholder="有哪些值得记住的事？" maxlength="12000"></textarea><div id="note-conflict" hidden><p>其他成员刚刚修改了备忘。最新内容：</p><pre id="latest-note" style="white-space:pre-wrap;max-height:140px;overflow:auto;font:inherit"></pre><button id="use-latest">采用最新内容</button><button id="keep-draft">保留我的内容，再次保存</button></div><footer><span class="count" id="note-state">云端共享</span><button id="save-note">保存备忘</button></footer></aside></div><p id="status" class="status" role="status">正在连接数据服务…</p><dialog id="edit-dialog"><form id="edit-form"><h2>修改待办</h2><label>内容<input id="edit-title" maxlength="200" required></label><label>截止日期<input type="date" id="edit-due"></label><footer><button type="button" id="edit-cancel">取消</button><button class="primary">保存修改</button></footer></form></dialog><dialog id="delete-dialog"><h2>删除这条待办？</h2><p>所有项目成员的列表都会更新。</p><footer><button id="delete-cancel">取消</button><button id="delete-confirm" class="danger">删除</button></footer></dialog><script>
const el=id=>document.getElementById(id),iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,monday=d=>{const n=new Date(d);n.setDate(n.getDate()-(n.getDay()+6)%7);n.setHours(12,0,0,0);return n;};
let week=iso(monday(new Date())),filter='all',items=[],noteDoc=null,dirty=false,busy=false,connected=false,todos,weeks,loadNumber=0,editing=null,deleting=null,pendingCreate=null,conflictNote=null,readOnly=false;
const status=(s,error=false)=>{el('status').textContent=s;el('status').className='status'+(error?' error':'');};
function enabled(){document.querySelectorAll('button,input,textarea').forEach(e=>e.disabled=busy||!connected||readOnly);}
function render(){const done=items.filter(r=>r.data.done).length;el('count').textContent=`${done} / ${items.length} 完成`;el('progress').style.width=(items.length?done/items.length*100:0)+'%';el('tasks').replaceChildren();const visible=items.filter(r=>filter==='all'||(filter==='done')===!!r.data.done);
 if(!visible.length){const li=document.createElement('li');li.className='empty';const strong=document.createElement('strong');strong.textContent=filter==='all'?'给这一周留一点期待':'这里暂时没有待办';li.append(strong,document.createTextNode('记下重要的小事，让每一步都有着落。'));el('tasks').append(li);}
 for(const r of visible){const li=document.createElement('li');li.className='task'+(r.data.done?' done':'');li.dataset.id=r.id;const check=document.createElement('button');check.className='check';check.ariaLabel=r.data.done?'标为未完成':'标为完成';check.setAttribute('aria-pressed',String(!!r.data.done));check.textContent=r.data.done?'✓':'';check.onclick=()=>run(()=>todos.update(r.id,{done:!r.data.done}));const body=document.createElement('div');body.className='task-body';const title=document.createElement('span');title.className='task-title';title.textContent=r.data.title;const date=document.createElement('small');date.textContent=r.data.due?'计划于 '+r.data.due:'本周慢慢完成';body.append(title,date);const edit=document.createElement('button');edit.className='edit';edit.textContent='编辑';edit.onclick=()=>{editing=r;el('edit-title').value=r.data.title;el('edit-due').value=r.data.due||'';el('edit-dialog').showModal();};const remove=document.createElement('button');remove.className='remove';remove.textContent='×';remove.ariaLabel='删除 '+r.data.title;remove.onclick=()=>{deleting=r;el('delete-dialog').showModal();};li.append(check,body,edit,remove);el('tasks').append(li);}enabled();}
async function reload(){const number=++loadNumber,target=week;const [rows,note]=await Promise.all([todos.list({where:{week:target},sort:'updated',descending:false}),weeks.get(target)]);if(number!==loadNumber||week!==target)return;items=rows;if(!dirty){noteDoc=note;el('note').value=note?.data.text||'';}render();}
async function run(fn){if(busy||!connected)return;busy=true;enabled();status('正在保存…');try{await fn();await reload();status('已保存到云端 · 团队同步可见');}catch(e){status(e.status===409?'内容刚被其他成员修改。草稿已保留，请核对最新内容后再保存。':e.message,true);}finally{busy=false;enabled();}}
function range(){const end=new Date(week+'T12:00:00');end.setDate(end.getDate()+6);el('range').textContent=week.replaceAll('-','.')+' — '+iso(end).replaceAll('-','.');}
async function switchWeek(value){if(busy)return;if(dirty&&!confirm('备忘尚未保存，切换周会丢弃本次草稿。继续？'))return;week=value;dirty=false;el('note-conflict').hidden=true;noteDoc=null;el('note-state').textContent='云端共享';range();try{await reload();status('已读取本周记录');}catch(e){status(e.message,true);}}
el('prev').onclick=()=>{const d=new Date(week+'T12:00:00');d.setDate(d.getDate()-7);switchWeek(iso(d));};el('next').onclick=()=>{const d=new Date(week+'T12:00:00');d.setDate(d.getDate()+7);switchWeek(iso(d));};el('today').onclick=()=>switchWeek(iso(monday(new Date())));
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(v=>v.setAttribute('aria-pressed',String(v===b)));render();});
el('add').onsubmit=e=>{e.preventDefault();const title=el('title').value.trim();if(!title)return;const data={title,week,done:false,due:el('due').value};if(!pendingCreate||JSON.stringify(pendingCreate.data)!==JSON.stringify(data))pendingCreate={id:Wanwu.uuid(),data};const id=pendingCreate.id;run(async()=>{try{await todos.create(data,{id});}catch(e){if(!await todos.get(id).catch(()=>null))throw e;}pendingCreate=null;el('title').value='';el('due').value='';});};
el('note').oninput=()=>{dirty=true;el('note-state').textContent='尚未保存';};el('save-note').onclick=()=>{const text=el('note').value;run(async()=>{try{if(noteDoc)await weeks.update(week,{text},{revision:noteDoc.revision});else await weeks.create({text},{id:week});}catch(e){if(e.status===409){conflictNote=await weeks.get(week);el('latest-note').textContent=conflictNote?.data.text||'（空白备忘）';el('note-conflict').hidden=false;}throw e;}dirty=false;el('note-conflict').hidden=true;el('note-state').textContent='已保存';});};
el('use-latest').onclick=()=>{noteDoc=conflictNote;el('note').value=noteDoc?.data.text||'';dirty=false;el('note-conflict').hidden=true;el('note-state').textContent='已读取最新内容';};el('keep-draft').onclick=()=>{noteDoc=conflictNote;el('note-conflict').hidden=true;el('save-note').click();};
el('edit-form').onsubmit=e=>{e.preventDefault();const title=el('edit-title').value.trim();if(!title||!editing)return;run(async()=>{await todos.update(editing.id,{title,due:el('edit-due').value},{revision:editing.revision});el('edit-dialog').close();});};el('edit-cancel').onclick=()=>el('edit-dialog').close();el('delete-cancel').onclick=()=>el('delete-dialog').close();el('delete-confirm').onclick=()=>run(async()=>{await todos.remove(deleting.id,{revision:deleting.revision});el('delete-dialog').close();});
enabled();range();Wanwu.ready.then(async c=>{if(!Wanwu.data)throw Error('请更新万物以启用画布数据服务');readOnly=!!c.preview?.readOnly;todos=Wanwu.data.collection('todos');weeks=Wanwu.data.collection('weeks');el('project').textContent=c.project.name+' · 团队共享备忘录';await reload();connected=true;enabled();status(readOnly?'周计划 · 团队共享':'已连接 · 所有记录自动从云端读取');await document.fonts.ready;requestAnimationFrame(()=>requestAnimationFrame(()=>Wanwu.cover.ready().catch(()=>{})));const refresh=()=>reload().catch(e=>status(e.message,true));todos.subscribe(refresh);weeks.subscribe(refresh);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh();});window.addEventListener('online',refresh);}).catch(e=>status(e.message,true));Wanwu.live.provide(()=>({page:'weekly-todo',week,filter,items,weeklyNote:noteDoc?.data.text||'',unsavedNote:dirty}));
</script></body></html>
