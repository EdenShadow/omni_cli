<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>多会话实时汇总</title><style>
:root{color-scheme:dark;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#101516;color:#e9eeea;font-size:14px}*{box-sizing:border-box}body{margin:0;padding:28px;max-width:1100px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:15px}small,.muted{color:#8faaa0}h1{font-size:24px;letter-spacing:-.6px;margin:10px 0 24px}button{background:transparent;color:#9db3aa;border:1px solid #30413c;border-radius:20px;padding:6px 12px;cursor:pointer}.status{font-size:12px;color:#99d7b5;display:flex;align-items:center;gap:8px}.dot{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 9px #78dda740}.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px}.stat,.agent{border:1px solid #2c3b35;background:linear-gradient(145deg,#1b2621,#161e1b);border-radius:16px;padding:20px}.number{font-size:42px;letter-spacing:-2px;font-variant-numeric:tabular-nums;margin-top:14px}.agents{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0 30px}.agent{padding:15px}.agent b{font-weight:500}.agent .value{font-variant-numeric:tabular-nums;font-size:21px;margin:20px 0 8px}.agent .meta{font-size:11px;color:#8faaa0}.agent.fresh{animation:glow .7s ease-out}@keyframes glow{from{border-color:#87c6a1;background:#284034}to{border-color:#2c3b35}}h2{font-weight:500;font-size:15px;margin-bottom:18px}table{width:100%;border-collapse:collapse;text-align:left;font-size:12px}th{color:#7b9388;font-weight:400}td,th{padding:12px 0;border-bottom:1px solid #27342f}td:last-child,th:last-child{text-align:right}footer{display:flex;justify-content:space-between;color:#74877e;font-size:11px;margin-top:24px;gap:12px}#empty{color:#8faaa0;padding:30px 0;text-align:center}@media(max-width:480px){body{padding:18px}h1{font-size:21px}.number{font-size:32px}.stat{padding:16px}.agents{gap:7px}.agent{padding:12px 8px}.agent .value{font-size:18px}.agent b{font-size:12px}}
</style><body><header><small>WANWU / LIVE CANVAS</small><button id="language">EN</button></header><h1 id="title">多会话实时汇总</h1><div class="stats"><section class="stat"><small id="eventsLabel">已汇总事件</small><div class="number" id="events">—</div></section><section class="stat"><small id="volumeLabel">模拟总量</small><div class="number" id="volume">—</div></section></div><div class="agents" id="agents"></div><header><h2 id="recentLabel">最近动态</h2><span class="status"><i class="dot"></i><span id="status">正在同步</span></span></header><table><thead><tr><th id="sourceLabel">来源</th><th id="seqLabel">序号</th><th id="valueLabel">模拟值</th><th id="timeLabel">时间</th></tr></thead><tbody id="rows"></tbody></table><p id="empty">等待会话写入</p><footer><span id="simulation">模拟数据 · 未连接交易系统</span><span id="revision">—</span></footer><script>
let english=false,data={},state='syncing',revisions={},renders=0,loadedAt=Date.now();const names=['alpha','beta','gamma'];const t=(zh,en)=>english?en:zh;
const $=id=>document.getElementById(id);
for(const name of names){const card=document.createElement('section');card.className='agent';card.id=name;card.innerHTML='<b>Agent '+name[0].toUpperCase()+name.slice(1)+'</b><div class="value">—</div><div class="meta">—</div>';$('agents').append(card);}
function draw(){
 const labels={title:['多会话实时汇总','Live agent overview'],eventsLabel:['已汇总事件','Events received'],volumeLabel:['模拟总量','Simulated volume'],recentLabel:['最近动态','Recent activity'],sourceLabel:['来源','Source'],seqLabel:['序号','Sequence'],valueLabel:['模拟值','Simulated value'],timeLabel:['时间','Time'],simulation:['模拟数据 · 未连接交易系统','Simulation · No live trading'],empty:['等待会话写入','Waiting for updates']};
 for(const [id,text]of Object.entries(labels))$(id).textContent=t(...text);$('language').textContent=english?'中文':'EN';
 $('events').textContent=(data.totals?.events||0).toLocaleString();$('volume').textContent=(data.totals?.volume||0).toLocaleString();
 for(const name of names){const agent=data['agent.'+name],card=$(name);card.querySelector('.value').textContent=agent?.value?.toFixed(2)||'—';card.querySelector('.meta').textContent=agent?t('更新 ','Update ')+agent.sequence:t('等待连接','Waiting');}
 $('status').textContent=state==='live'?t('实时同步','Live'):state==='syncing'?t('正在同步','Syncing'):t('正在重连','Reconnecting');
 $('rows').replaceChildren();for(const item of [...(data.recent||[])].reverse().slice(0,6)){const row=document.createElement('tr');for(const text of [item.agent,'#'+item.sequence,Number(item.value).toFixed(2),new Date(item.time).toLocaleTimeString(english?'en-GB':'zh-CN',{hour12:false})]){const cell=document.createElement('td');cell.textContent=text;row.append(cell);}$('rows').append(row);}
 $('empty').hidden=!!data.recent?.length;$('revision').textContent=t('数据版本 ','Revision ')+(revisions.totals||0);renders++;
}
$('language').onclick=()=>{english=!english;draw();};
Wanwu.state.watch([...names.map(n=>'agent.'+n),'totals','recent'],({items})=>{for(const item of items){if(item.key.startsWith('agent.')&&item.revision!==revisions[item.key]){const card=$(item.key.slice(6));card.classList.remove('fresh');requestAnimationFrame(()=>card.classList.add('fresh'));}data[item.key]=item.value;revisions[item.key]=item.revision;}draw();},{onStatus(status){state=status;draw();}});
Wanwu.live.provide(()=>({events:data.totals?.events||0,volume:data.totals?.volume||0,revisions,renders,loadedAt,simulation:true}));
</script></body></html>
