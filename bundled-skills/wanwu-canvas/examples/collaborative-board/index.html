<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>共绘 / Shared drawing</title><link rel="stylesheet" href="style.css"></head>
<body>
 <header><div class="identity"><span class="mark">✳</span><h1 data-zh="共绘" data-en="Shared drawing">共绘</h1><span id="status" role="status">连接中</span></div><div class="people"><span id="participants">0</span><span data-zh="位协作者" data-en="collaborators">位协作者</span><button id="export" data-zh="导出 SVG" data-en="Export SVG">导出 SVG</button></div></header>
 <main id="surface" aria-label="共享画板"><svg id="board" viewBox="0 0 1200 760" preserveAspectRatio="xMidYMid meet"><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#b2bac6" opacity=".5"/></pattern></defs><rect width="1200" height="760" fill="url(#dots)"/><g id="objects"></g><g id="previews" opacity=".75"></g><g id="draft"></g></svg><p id="empty" data-zh="落下第一笔，或让 AI 一起画。" data-en="Make the first mark, or draw with AI.">落下第一笔，或让 AI 一起画。</p></main>
 <nav aria-label="绘图工具"><div class="tools"><button data-tool="pen" aria-pressed="true" data-zh="笔刷" data-en="Pen">笔刷</button><button data-tool="marker" aria-pressed="false" data-zh="荧光笔" data-en="Marker">荧光笔</button><button data-tool="rect" aria-pressed="false" data-zh="矩形" data-en="Rectangle">矩形</button><button data-tool="ellipse" aria-pressed="false" data-zh="圆形" data-en="Ellipse">圆形</button><button data-tool="erase" aria-pressed="false" data-zh="橡皮" data-en="Eraser">橡皮</button></div><label><span class="sr" data-zh="颜色" data-en="Color">颜色</span><input type="color" id="color" value="#5b58cf" aria-label="颜色"></label><label class="size"><span data-zh="粗细" data-en="Size">粗细</span><input id="width" type="range" min="2" max="16" value="4" aria-label="笔刷粗细"></label></nav>
 <p id="error" role="alert"></p><script src="app.js"></script>
</body></html>
