<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 320" fill="none" stroke-linecap="round" stroke-linejoin="round">
<title>香蕉叔叔，平涂手绘风格的细长点子顾问</title>
<style>
[data-part]{transform-box:view-box;transform-origin:110px 282px}
[data-part="body"],[data-part="direction"]{transform-origin:110px 263px}
[data-part="stem"]{transform-origin:154px 65px}
[data-part="face"]{transform-origin:148px 125px}
[data-part="eyes"]{transform-origin:148px 121px}
[data-part="glasses"]{transform-origin:148px 117px}
[data-part="tie"]{transform-origin:146px 159px}
[data-part="arm-l"]{transform-origin:123px 176px}
[data-part="arm-r"]{transform-origin:169px 163px}
[data-part="foot-l"]{transform-origin:96px 261px}
[data-part="foot-r"]{transform-origin:121px 259px}
[data-part="pen"]{transform-origin:169px 163px}
[data-part="prop"],[data-part="pen"],[data-part="sleep"],.sleep-eyes,.yawn{opacity:0}
[data-facing="left"] [data-part="face"]{transform:translateX(-4px)}
[data-facing="right"] [data-part="face"]{transform:translateX(4px)}
[data-state="working"] [data-part="prop"],[data-state="working"] [data-part="pen"],
[data-state="tired"] [data-part="sleep"],[data-state="tired"] .sleep-eyes,[data-state="tired"] .yawn{opacity:1}
[data-state="working"] .rest-arm{opacity:0}
[data-state="tired"] [data-part="eyes"],[data-state="tired"] .smile{opacity:0}
[data-part="work-accent"]{opacity:0}

[data-expression]{display:none}
[data-clip="work-frantic"] [data-expression="frantic"],
[data-clip="work-frustrated"] [data-expression="frustrated"],
[data-clip="work-emo"] [data-expression="emo"],
[data-state="done"] [data-expression="done"]{display:inline}
:is([data-clip="work-frantic"],[data-clip="work-frustrated"],[data-clip="work-emo"],[data-state="done"]) :is([data-part="eyes"],.smile,.neutral-brows){visibility:hidden}
[data-state="done"] [data-part="prop"],[data-state="done"] [data-part="pen"],[data-state="done"] .work-tool{opacity:1}
[data-state="done"] .rest-arm{opacity:0}

.celebration [data-part]{opacity:0;transform-origin:0px 0px}
svg:not([data-state="done"]) .celebration{visibility:hidden}

/* Sitting is a bent-leg pose, independently animated from standing/walking. */
.sit-legs,.sit-prop,.sit-face{display:none}
[data-state="sitting"] .sit-legs{display:inline}
[data-state="sitting"] :is([data-part="foot-l"],[data-part="foot-r"]){visibility:hidden}
[data-clip="sit-game"] .sit-prop,[data-clip="sit-goofy"] .sit-face{display:inline}
[data-clip="sit-goofy"] :is([data-part="eyes"],.smile){visibility:hidden}
[data-part="sit-foot-l"]{transform-origin:96px 258px}
[data-part="sit-foot-r"]{transform-origin:120px 258px}
[data-part="sit-controller"]{transform-origin:138px 191px}
[data-part="sit-tongue"]{transform-origin:148px 137px}
[data-clip="sit-game"] :is([data-part="arm-l"],[data-part="arm-r"]){visibility:hidden}
</style>
