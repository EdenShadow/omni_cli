<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none" stroke-linecap="round" stroke-linejoin="round">
<title>芽团，平涂手绘风格的灵感整理员</title>
<style>
[data-part]{transform-box:view-box;transform-origin:120px 201px}
[data-part="letter"]{transform-origin:121px 184px}
[data-part="leaf"]{transform-origin:121px 84px}
[data-part="arm-l"]{transform-origin:71px 150px}
[data-part="arm-r"]{transform-origin:169px 150px}
[data-part="eyes"]{transform-origin:120px 131px}
[data-part="foot-l"]{transform-origin:96px 194px}
[data-part="foot-r"]{transform-origin:147px 194px}
[data-part="face"]{transform-origin:120px 135px}
[data-part="body"]{transform-origin:120px 194px}
[data-part="prop"],[data-part="sleep"],.sleep-eyes,.yawn{opacity:0}
[data-facing="left"] [data-part="face"]{transform:translateX(-7px)}
[data-facing="right"] [data-part="face"]{transform:translateX(7px)}
[data-state="working"] [data-part="prop"],[data-state="tired"] [data-part="sleep"],
[data-state="tired"] .sleep-eyes,[data-state="tired"] .yawn{opacity:1}
[data-state="tired"] [data-part="eyes"],[data-state="tired"] .smile{opacity:0}
[data-part="work-accent"]{opacity:0}

[data-expression]{display:none}
[data-clip="work-frantic"] [data-expression="frantic"],
[data-clip="work-frustrated"] [data-expression="frustrated"],
[data-clip="work-emo"] [data-expression="emo"],
[data-state="done"] [data-expression="done"]{display:inline}
:is([data-clip="work-frantic"],[data-clip="work-frustrated"],[data-clip="work-emo"],[data-state="done"]) :is([data-part="eyes"],.smile,.neutral-brows){visibility:hidden}

.celebration [data-part]{opacity:0;transform-origin:0px 0px}
svg:not([data-state="done"]) .celebration{visibility:hidden}

/* Sitting is a bent-leg pose, independently animated from standing/walking. */
.sit-legs,.sit-prop,.sit-face{display:none}
[data-state="sitting"] .sit-legs{display:inline}
[data-state="sitting"] :is([data-part="foot-l"],[data-part="foot-r"]){visibility:hidden}
[data-clip="sit-game"] .sit-prop,[data-clip="sit-goofy"] .sit-face{display:inline}
[data-clip="sit-goofy"] :is([data-part="eyes"],.smile){visibility:hidden}
[data-part="sit-foot-l"]{transform-origin:98px 187px}
[data-part="sit-foot-r"]{transform-origin:144px 187px}
[data-part="sit-controller"]{transform-origin:120px 161px}
[data-part="sit-tongue"]{transform-origin:120px 148px}
[data-clip="sit-game"] :is([data-part="arm-l"],[data-part="arm-r"]){visibility:hidden}
</style>
