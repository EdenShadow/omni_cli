<style>
body{padding:0}.studio{padding:24px;background:var(--card);min-height:440px}header{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);letter-spacing:.14em}.studio h1{font-size:27px;font-weight:600;margin:20px 0 5px}.intro{color:var(--muted);font-size:12px;margin:0 0 22px}.film{width:210px;margin:0 auto 22px;padding:12px 12px 26px;background:#f7f3e8;border:1px solid #e3decf;transform:rotate(-3deg);box-shadow:0 6px 18px #00000012;transition:transform .4s}.film:hover{transform:rotate(0deg)}.exposure{position:relative;aspect-ratio:1;background:#dfd9c9;display:grid;place-items:center;overflow:hidden}.exposure svg{opacity:.45;color:#625a49}.exposure img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:develop .9s ease-out}.film>span{display:block;color:#756953;text-align:center;font-family:serif;font-size:12px;padding-top:14px;letter-spacing:.14em}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}.buttons button{border:1px solid var(--line);border-radius:12px;color:var(--ink);background:transparent;min-height:44px}label{display:block;color:var(--muted);font-size:11px;margin-top:18px}textarea{display:block;width:100%;margin-top:7px;resize:vertical}.submit{width:100%;border:0;background:#687663;color:white;border-radius:12px;margin-top:18px;min-height:46px}.submit:disabled{opacity:.5}#status{font-size:12px;color:var(--muted);margin-top:10px}@keyframes develop{from{filter:brightness(1.7) saturate(0);opacity:.2}to{filter:none;opacity:1}}
@media(max-width:400px){.studio{padding:20px;min-height:0}.studio h1{font-size:20px;margin-top:12px}.film{width:135px;padding:8px 8px 18px;margin-bottom:14px}.film>span{font-size:10px;padding-top:8px}.intro{font-size:11px;margin-bottom:12px}label{margin-top:12px}textarea{min-height:58px}.submit{margin-top:12px}}
.close{flex:none;width:44px;min-height:44px;border:0;border-radius:50%;background:transparent;color:var(--muted);font-size:23px;line-height:1}.close:hover{background:color-mix(in srgb,var(--ink),transparent 94%)}
</style>
<main class="studio"><header><span>WANWU · PHOTO ATELIER</span><span>FRAME 01</span><button class="close" id="close" aria-label="稍后继续">×</button></header><h1>把此刻，留在纸上。</h1><p class="intro">选一张照片，或用手机拍下此刻。下一步交给 AI。</p><div class="film"><div class="exposure"><svg width="44" height="36" viewBox="0 0 44 36" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="8" width="40" height="26" rx="5"/><path d="M12 8l3-6h14l3 6"/><circle cx="22" cy="21" r="8"/></svg><img id="photo" hidden alt="选中的照片"></div><span>A LITTLE MOMENT</span></div><div class="buttons"><button id="gallery">从相册选择</button><button id="camera">拍一张</button></div><label>想让 AI 怎么处理？<textarea id="caption" rows="2" maxlength="1000" placeholder="比如：做成旅行明信片，写一句有趣的配文…"></textarea></label><button class="submit" id="submit" disabled>带着照片，继续创作 →</button><div id="status" role="status"></div></main>
<script>
(async()=>{const ui=await Wanwu.interaction.ready;let selected=ui.files.get(),preview;const $=id=>document.getElementById(id);$('close').onclick=()=>ui.close();$('caption').value=ui.state.get().caption||'';
function show(){if(preview)URL.revokeObjectURL(preview);if(selected[0]){$('photo').src=preview=URL.createObjectURL(selected[0]);$('photo').hidden=false;$('submit').disabled=false;}}
async function pick(camera){try{const files=await ui.files.pick({accept:'image/*',capture:camera?'environment':undefined});if(files.length){selected=files;show();}}catch(e){$('status').textContent=e.message;}}
$('gallery').onclick=()=>pick(false);$('camera').onclick=()=>pick(true);$('caption').oninput=()=>ui.state.set({caption:$('caption').value});$('submit').onclick=async()=>{try{await ui.submit({text:$('caption').value||'请把这张照片制作成精美的拍立得风格画布，并提供带封面的画布入口。',values:{style:'polaroid'},files:selected});}catch(e){$('status').textContent=e.message;}};addEventListener('wanwu-busy',e=>{$('status').textContent=e.detail?'正在把照片送给 AI…':'';});show();})();
</script>
