<style>
body{padding:0}.fortune{padding:28px 24px 24px;position:relative;overflow:hidden;background:var(--card);min-height:430px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}header span{font-size:11px;letter-spacing:.13em;color:var(--muted)}.seal{border:1px solid #ba7456;color:#ba7456;border-radius:7px;padding:4px 6px;font-size:11px}.eyebrow{color:#b77752;font-size:11px;letter-spacing:.2em}h1{font-size:29px;font-weight:600;letter-spacing:.06em;margin:7px 0 8px}p{color:var(--muted);font-size:13px;margin:0 0 22px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choices button{padding:14px;text-align:left;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:13px}.choices button[aria-pressed=true]{border-color:#b77752;background:#b7775210}.choices small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.next{width:100%;margin-top:24px;border:0;border-radius:12px;background:#a96243;color:#fff;min-height:46px}.back{border:0;background:none;color:var(--muted);font-size:12px;padding:0;min-height:32px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fields label{font-size:12px;color:var(--muted)}.fields input{display:block;width:100%;margin-top:7px}.fields label:first-child{grid-column:1/-1}.scene{height:177px;display:grid;place-items:center;position:relative}.ring{position:absolute;width:155px;height:155px;border:1px solid #b7775225;border-radius:50%}.ring:after{content:'';position:absolute;inset:12px;border:1px dashed #b7775230;border-radius:50%}.cup{position:relative;width:76px;height:92px;transform:rotate(-5deg);transform-origin:bottom center}.sticks{position:absolute;left:9px;right:9px;top:-14px;display:flex;justify-content:space-around;align-items:end;height:65px}.sticks i{width:8px;height:65px;background:#dcb888;border:1px solid #c49e6c;border-radius:3px}.sticks i:nth-child(2n){height:56px;transform:rotate(7deg)}.vessel{position:absolute;inset:30px 0 0;background:#ad6348;border:1px solid #834c38;border-radius:5px 5px 18px 18px;box-shadow:inset 7px 0 #ffffff0e,inset -7px 0 #0000000a;display:grid;place-items:center;color:#f5dbc4;font-size:23px}.shake .cup{animation:shake .65s ease-in-out 3}.ticket{font-size:22px;font-weight:600;text-align:center;margin:8px 0;color:#b77752}.hint{text-align:center;margin:0;font-size:11px}.result-label{text-align:center;color:var(--muted);font-size:11px}.page[hidden]{display:none}#status{margin-top:12px;font-size:12px;color:var(--muted);text-align:center}@keyframes shake{0%,100%{transform:rotate(-5deg)}25%{transform:rotate(12deg) translateY(-3px)}65%{transform:rotate(-13deg)}}
.close{flex:none;width:44px;min-height:44px;border:0;border-radius:50%;background:transparent;color:var(--muted);font-size:23px;line-height:1}.close:hover{background:color-mix(in srgb,var(--ink),transparent 94%)}
</style>
<main class="fortune"><header><span>WANWU · LITTLE RITUALS</span><span class="seal">一事一签</span><button class="close" id="close" aria-label="稍后继续">×</button></header>
<section class="page" id="intent"><span class="eyebrow">01 / 问心</span><h1>给今天，一点好兆头。</h1><p>先选一件心里惦记的事，再摇出你的签。</p><div class="choices"><button data-intent="事业" aria-pressed="true">事业与方向<small>下一步，怎么走</small></button><button data-intent="关系" aria-pressed="false">关系与相遇<small>把心事轻轻说</small></button><button data-intent="生活" aria-pressed="false">生活与日常<small>好事正在路上</small></button><button data-intent="灵感" aria-pressed="false">灵感与创作<small>让想法冒个芽</small></button></div><button class="next" id="to-details">继续，写下心愿 →</button></section>
<section class="page" id="details" hidden><button class="back" data-back="intent">← 返回</button><div class="eyebrow">02 / 留愿</div><h1>留一句，心里的话。</h1><p>昵称和生日可选，不填写也可以抽签。</p><div class="fields"><label>想问的事<input id="wish" maxlength="500" placeholder="最近在认真准备的一件事…"></label><label>昵称<input id="nickname" maxlength="40" placeholder="怎么称呼你"></label><label>生日（可选）<input id="birthday" type="date"></label></div><button class="next" id="to-draw">准备好了，去摇签 →</button></section>
<section class="page" id="draw" hidden><button class="back" data-back="details">← 返回</button><div class="eyebrow">03 / 摇签</div><h1>心有回响，签有微光。</h1><div class="scene"><span class="ring"></span><div class="cup"><div class="sticks"><i></i><i></i><i></i><i></i><i></i></div><div class="vessel">签</div></div></div><div class="ticket" id="ticket" hidden></div><p class="hint" id="hint">轻点摇签；手机也可开启体感后轻摇。</p><button class="back" id="motion">用手机摇签</button><button class="next" id="shake">轻轻摇一摇</button><button class="next" id="finish" hidden>交给 AI，解读这份心愿 →</button></section><div id="status" role="status"></div></main>
<script>
(async()=>{const ui=await Wanwu.interaction.ready;let state={page:'intent',intent:'事业',wish:'',nickname:'',birthday:'',...ui.state.get()},animating=false;
const $=id=>document.getElementById(id),save=()=>ui.state.set(state);$('close').onclick=()=>ui.close();$('motion').onclick=async()=>{const result=await ui.motion.requestPermission();$('hint').textContent=result==='granted'?'轻轻摇动手机，也可以点击摇签。':'当前设备请点击摇签，同样可以抽取。';};
function page(id){state.page=id;document.querySelectorAll('.page').forEach(e=>e.hidden=e.id!==id);save();}
for(const key of ['wish','nickname','birthday']){$(key).value=state[key];$(key).oninput=e=>{state[key]=e.target.value;save();};}
document.querySelectorAll('[data-intent]').forEach(b=>{b.setAttribute('aria-pressed',String(state.intent===b.dataset.intent));b.onclick=()=>{state.intent=b.dataset.intent;document.querySelectorAll('[data-intent]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));save();};});
document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>page(b.dataset.back));$('to-details').onclick=()=>page('details');$('to-draw').onclick=()=>page('draw');
function result(){if(!state.sign)return;$('ticket').textContent=state.sign;$('ticket').hidden=false;$('shake').hidden=true;$('finish').hidden=false;$('hint').textContent='你的心愿已经装进这支签，交给 AI 接着解读。';}
function shake(){if(animating||state.sign||state.page!=='draw')return;animating=true;document.querySelector('.scene').classList.add('shake');setTimeout(()=>{state.sign=['春山可望','微光将至','好事慢慢来','风起正当时'][crypto.getRandomValues(new Uint8Array(1))[0]%4];save();result();animating=false;document.querySelector('.scene').classList.remove('shake');},1600);}
$('shake').onclick=shake;let last=0;ui.motion.subscribe(e=>{const now=performance.now();if(now-last>2500&&Math.abs(e.gamma||0)>28){last=now;shake();}});
$('finish').onclick=async()=>{try{await ui.submit({text:'请用温柔、有创意的方式解读这份娱乐签，为我生成带封面和名称的结果画布。',values:{...state,page:undefined},files:[]});}catch(e){$('status').textContent=e.message;}};
addEventListener('wanwu-busy',e=>{$('status').textContent=e.detail?'正在提交这份心愿…':'';});page(state.page);result();})();
</script>
